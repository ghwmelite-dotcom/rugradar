<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#00ff9d"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff9d" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#00ff9d" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="blip" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff5c5c"/>
      <stop offset="60%" stop-color="#ff5c5c" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ff5c5c" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#00e5ff" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Dark background disc (TradeMetrics family) -->
  <circle cx="256" cy="256" r="240" fill="#05080d" stroke="url(#glow)" stroke-width="3"/>
  <!-- Radar rings -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#00e5ff" stroke-width="2" stroke-opacity="0.28"/>
  <circle cx="256" cy="256" r="130" fill="none" stroke="#00e5ff" stroke-width="2" stroke-opacity="0.2"/>
  <circle cx="256" cy="256" r="70" fill="none" stroke="#00e5ff" stroke-width="2" stroke-opacity="0.14"/>
  <!-- Cross hairs -->
  <line x1="256" y1="66" x2="256" y2="446" stroke="#00e5ff" stroke-width="1.5" stroke-opacity="0.12"/>
  <line x1="66" y1="256" x2="446" y2="256" stroke="#00e5ff" stroke-width="1.5" stroke-opacity="0.12"/>
  <!-- Radar sweep wedge -->
  <path d="M 256 256 L 256 66 A 190 190 0 0 1 420 122 Z" fill="url(#sweep)"/>
  <line x1="256" y1="256" x2="256" y2="66" stroke="#00ff9d" stroke-width="5" stroke-linecap="round" stroke-opacity="0.9" filter="url(#shadow)"/>
  <!-- Detected rug: red blip caught by the sweep -->
  <circle cx="330" cy="148" r="34" fill="url(#blip)"/>
  <circle cx="330" cy="148" r="12" fill="#ff5c5c"/>
  <!-- Center dot -->
  <circle cx="256" cy="256" r="10" fill="url(#glow)" filter="url(#shadow)"/>
</svg>
